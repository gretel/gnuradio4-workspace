# SPDX-License-Identifier: MIT
name: Docker

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'src/**'
      - 'gnuradio4/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: "SDK image (x86_64)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build SDK image
        run: docker build -f Dockerfile -t gr4-workspace:sdk .

      - name: Smoke test — run binary
        run: docker run --rm gr4-workspace:sdk

  cross-armv7:
    name: "cross-armv7 (PlutoSDR)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build cross-armv7 image
        run: docker build -f docker/Dockerfile.cross-armv7 -t gr4-workspace:armv7 .

      - name: Verify ARM binary
        run: |
          docker run --rm --entrypoint file gr4-workspace:armv7 /opt/gnuradio4/bin/gnuradio4 | tee /tmp/armv7-check.txt
          grep -q 'ELF 32-bit.*ARM' /tmp/armv7-check.txt
          echo 'cross-armv7: valid ARMv7 binary'

  cross-aarch64:
    name: "cross-aarch64 (Raspberry Pi)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build cross-aarch64 image
        run: docker build -f docker/Dockerfile.cross-aarch64 -t gr4-workspace:aarch64 .

      - name: Verify AARCH64 binary
        run: |
          docker run --rm --entrypoint file gr4-workspace:aarch64 /opt/gnuradio4/bin/gnuradio4 | tee /tmp/aarch64-check.txt
          grep -q 'ELF 64-bit.*ARM aarch64' /tmp/aarch64-check.txt
          echo 'cross-aarch64: valid AARCH64 binary'
