# SPDX-License-Identifier: MIT
name: CI

on:
  workflow_dispatch:

jobs:
  # ── GitHub-hosted runners: macOS + Linux ──
  build:
    name: "${{ matrix.os }} / ${{ matrix.config }}"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
        config: [sdk, ci]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install deps
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install llvm cmake ninja ccache libsoundio cpp-httplib
          else
            sudo apt-get update && \
              sudo apt-get install -y cmake ninja-build ccache g++-14 \
                libsoundio-dev libcpp-httplib-dev
          fi
      - name: Configure
        env:
          CC: ${{ runner.os == 'macOS' && 'clang' || 'gcc-14' }}
          CXX: ${{ runner.os == 'macOS' && 'clang++' || 'g++-14' }}
        run: >
          cmake --preset ${{ runner.os == 'macOS' && 'macos' || 'linux' }}
          -DBUILD_CONFIG=${{ matrix.config }}
      - name: Build
        run: cmake --build build/dev
      - name: Smoke test
        if: matrix.config == 'ci'
        run: ./build/dev/src/gnuradio4
      - name: Install (generates SBOM)
        run: cmake --install build/dev --prefix build/install
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.os }}-${{ matrix.config }}
          path: build/install/share/*.spdx

  # ── Full profile (main branch only) ──
  full:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install deps
        run: |
          sudo apt-get update && \
          sudo apt-get install -y cmake ninja-build ccache g++-14 \
            libsoundio-dev libcpp-httplib-dev
      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --preset linux -DBUILD_CONFIG=full
      - name: Build
        run: cmake --build build/dev
      - name: Smoke test
        run: ./build/dev/src/gnuradio4
      - name: Install (generates SBOM)
        run: cmake --install build/dev --prefix build/install
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-full
          path: build/install/share/*.spdx

  # ── Self-hosted Windows (LLVM MinGW, ARM64) ──
  windows:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Workflow (configure + build + smoke test)
        env:
          BUILD_CONFIG: sdk
        run: cmake --workflow --preset windows
      - name: Install (generates SBOM)
        run: cmake --install build/dev --prefix build/install
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-windows
          path: build/install/share/*.spdx
