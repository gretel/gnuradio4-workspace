# cmake-format / cmake-lint config for gnuradio4-workspace

format:
  line_width: 120
  tab_size: 4
  max_subgroups_hwrap: 4
  max_pargs_hwrap: 6
  max_rows_cmdline: 8
  separate_ctrl_name_with_space: false
  separate_fn_name_with_space: false
  dangle_parens: false
  use_tabchars: false
  fractional_tab_policy: use-space

lint:
  # CMake convention: macros are lowercase (like commands/functions)
  macro_pattern: '[0-9a-z_]+'
  # CMake built-in CACHE vars use mixed case (e.g. Python3_EXECUTABLE)
  global_var_pattern: '[A-Za-z][0-9A-Za-z_]+'
  # Private vars in this project use _lowercase convention
  private_var_pattern: '_[a-z][a-z0-9_]+'

markup:
  enable_markup: false
