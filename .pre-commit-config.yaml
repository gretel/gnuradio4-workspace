# pre-commit config for gnuradio4-workspace.
# Run: prek run --all-files   (or: pre-commit run --all-files)
#
# NOT in pre-commit:
#   markdownlint — .md files are design docs, not committed code.
#   cmake-format  — cmake-lint handles style; format is opt-in via editor.

repos:
  # --- File-level hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # --- Python ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: ['--fix', '--exit-non-zero-on-fix']
        exclude: '^scripts/kconfig/'
      - id: ruff-format
        exclude: '^scripts/kconfig/'

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        exclude: '^scripts/kconfig/'

  # --- C++ ---
  # Pinned to v18.1.8 to match CI (brew llvm ships v22 but format differs).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]

  # --- CMake ---
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-lint
        additional_dependencies: ['pyyaml']
        # exclude cmake-kconfig vendored files (upstream repo conventions differ)
        exclude: |
          (?x)^(
            cmake/kconfig\.cmake|
            cmake/extensions\.cmake|
            cmake/python\.cmake|
            cmake/sbom\.cmake|
            scripts/kconfig/.*
          )$

  # --- GitHub Actions ---
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
